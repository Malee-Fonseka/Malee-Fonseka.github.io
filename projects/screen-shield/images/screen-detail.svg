<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" font-family="'Fira Code', 'Cascadia Code', Consolas, Menlo, monospace">
  <title>App detail wireframe</title>
  <rect width="360" height="720" fill="#0d1011"/>
  <rect x="20" y="10" width="320" height="700" rx="36" fill="#101315" stroke="#b3bbc1" stroke-opacity=".45"/>
  <rect x="34" y="24" width="292" height="672" rx="26" fill="#0b0d0e" stroke="#b3bbc1" stroke-opacity=".12"/>
  <rect x="150" y="34" width="60" height="8" rx="4" fill="#1b2023"/>

  <text x="54" y="80" font-size="12" fill="#9aa3a8">‹ back</text>

  <!-- App heading -->
  <rect x="54" y="100" width="52" height="52" fill="#1b2023"/>
  <text x="122" y="122" font-size="18" font-weight="600" fill="#e7ebed">video app</text>
  <text x="122" y="144" font-size="11" fill="#788187">category: video</text>

  <!-- Warning banner -->
  <rect x="54" y="176" width="252" height="56" fill="#3d9f96" fill-opacity=".1" stroke="#3d9f96" stroke-opacity=".4"/>
  <rect x="54" y="176" width="3" height="56" fill="#3d9f96"/>
  <text x="70" y="200" font-size="12" font-weight="600" fill="#66c2b8">80% of today's limit</text>
  <text x="70" y="220" font-size="11" fill="#9aa3a8">12 minutes left</text>

  <!-- Usage vs limit -->
  <text x="54" y="284" font-size="28" font-weight="600" fill="#e7ebed">48<tspan font-size="16" fill="#788187" font-weight="400"> / 60 min</tspan></text>
  <rect x="54" y="300" width="252" height="6" fill="#1b2023"/>
  <rect x="54" y="300" width="202" height="6" fill="#3d9f96"/>
  <path d="M255.5 294V312" stroke="#b3bbc1" stroke-opacity=".6"/>
  <text x="256" y="328" font-size="9" fill="#788187" text-anchor="middle">80%</text>

  <!-- Last 7 days -->
  <text x="54" y="370" font-size="10" fill="#788187" letter-spacing="1.5">LAST 7 DAYS</text>
  <g fill="#2a3134">
    <rect x="58" y="440" width="24" height="60"/>
    <rect x="94" y="418" width="24" height="82"/>
    <rect x="130" y="452" width="24" height="48"/>
    <rect x="166" y="404" width="24" height="96"/>
    <rect x="202" y="430" width="24" height="70"/>
    <rect x="238" y="396" width="24" height="104"/>
  </g>
  <rect x="274" y="436" width="24" height="64" fill="#3d9f96"/>
  <path d="M54 410H306" stroke="#b3bbc1" stroke-opacity=".55" stroke-dasharray="4 4"/>
  <text x="306" y="404" font-size="9" fill="#9aa3a8" text-anchor="end">limit 60m</text>
  <path d="M54 500.5H306" stroke="#b3bbc1" stroke-opacity=".3"/>

  <!-- Actions -->
  <rect x="54" y="548" width="120" height="40" fill="none" stroke="#b3bbc1" stroke-opacity=".35"/>
  <text x="114" y="573" font-size="11" fill="#d5dadd" text-anchor="middle">edit limit</text>
  <rect x="186" y="548" width="120" height="40" fill="#143936" stroke="#3d9f96"/>
  <text x="246" y="573" font-size="11" fill="#e7ebed" text-anchor="middle">block app</text>

  <!-- Tab bar -->
  <path d="M34 640.5H326" stroke="#b3bbc1" stroke-opacity=".15"/>
  <g font-size="10" text-anchor="middle">
    <rect x="86" y="652" width="12" height="12" fill="#3d9f96"/><text x="92" y="680" fill="#66c2b8">home</text>
    <rect x="174" y="652" width="12" height="12" fill="none" stroke="#788187"/><text x="180" y="680" fill="#788187">simulate</text>
    <rect x="262" y="652" width="12" height="12" fill="none" stroke="#788187"/><text x="268" y="680" fill="#788187">settings</text>
  </g>
</svg>
