<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" font-family="'Fira Code', 'Cascadia Code', Consolas, Menlo, monospace">
  <title>Settings wireframe</title>
  <rect width="360" height="720" fill="#0d1011"/>
  <rect x="20" y="10" width="320" height="700" rx="36" fill="#101315" stroke="#b3bbc1" stroke-opacity=".45"/>
  <rect x="34" y="24" width="292" height="672" rx="26" fill="#0b0d0e" stroke="#b3bbc1" stroke-opacity=".12"/>
  <rect x="150" y="34" width="60" height="8" rx="4" fill="#1b2023"/>

  <text x="54" y="86" font-size="18" font-weight="600" fill="#e7ebed">Settings</text>

  <!-- Account card -->
  <rect x="54" y="108" width="252" height="72" fill="#101315" stroke="#b3bbc1" stroke-opacity=".2"/>
  <circle cx="86" cy="144" r="18" fill="#1b2023" stroke="#b3bbc1" stroke-opacity=".3"/>
  <rect x="116" y="132" width="110" height="8" fill="#2a3134"/>
  <rect x="116" y="150" width="150" height="6" fill="#1b2023"/>

  <!-- Language -->
  <text x="54" y="222" font-size="10" fill="#788187" letter-spacing="1.5">LANGUAGE · භාෂාව</text>
  <rect x="54" y="234" width="252" height="40" fill="none" stroke="#b3bbc1" stroke-opacity=".3"/>
  <text x="117" y="259" font-size="12" fill="#9aa3a8" text-anchor="middle">English</text>
  <rect x="181" y="235" width="124" height="38" fill="#143936"/>
  <text x="243" y="259" font-size="13" fill="#66c2b8" text-anchor="middle">සිංහල</text>

  <!-- Security -->
  <text x="54" y="320" font-size="10" fill="#788187" letter-spacing="1.5">SECURITY</text>
  <path d="M54 332.5H306" stroke="#b3bbc1" stroke-opacity=".15"/>
  <text x="54" y="364" font-size="12" fill="#d5dadd">PIN lock</text>
  <text x="54" y="382" font-size="10" fill="#788187">protects parental settings</text>
  <rect x="262" y="352" width="44" height="22" rx="11" fill="#143936" stroke="#3d9f96"/>
  <circle cx="294" cy="363" r="7" fill="#66c2b8"/>
  <path d="M54 400.5H306" stroke="#b3bbc1" stroke-opacity=".15"/>
  <text x="54" y="432" font-size="12" fill="#d5dadd">limit alerts</text>
  <text x="54" y="450" font-size="10" fill="#788187">warn before a limit is hit</text>
  <rect x="262" y="420" width="44" height="22" rx="11" fill="#143936" stroke="#3d9f96"/>
  <circle cx="294" cy="431" r="7" fill="#66c2b8"/>
  <path d="M54 468.5H306" stroke="#b3bbc1" stroke-opacity=".15"/>

  <!-- Sign out -->
  <rect x="54" y="540" width="252" height="40" fill="none" stroke="#b3bbc1" stroke-opacity=".35"/>
  <text x="180" y="565" font-size="12" fill="#d5dadd" text-anchor="middle">sign out</text>

  <!-- Tab bar -->
  <path d="M34 640.5H326" stroke="#b3bbc1" stroke-opacity=".15"/>
  <g font-size="10" text-anchor="middle">
    <rect x="86" y="652" width="12" height="12" fill="none" stroke="#788187"/><text x="92" y="680" fill="#788187">home</text>
    <rect x="174" y="652" width="12" height="12" fill="none" stroke="#788187"/><text x="180" y="680" fill="#788187">simulate</text>
    <rect x="262" y="652" width="12" height="12" fill="#3d9f96"/><text x="268" y="680" fill="#66c2b8">settings</text>
  </g>
</svg>
