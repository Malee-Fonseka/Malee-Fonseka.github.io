<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Fira Code', Consolas, Menlo, monospace">
  <title>Wireframe of the desktop app: controls on the left, live overlay view in the centre, verdict and per-class statistics on the right</title>
  <rect width="960" height="560" fill="#0d1011"/>

  <!-- window frame -->
  <rect x="16" y="16" width="928" height="528" fill="#101315" stroke="#b3bbc1" stroke-opacity=".3"/>
  <path d="M16 44.5H944" stroke="#b3bbc1" stroke-opacity=".2"/>
  <g fill="#2a3134"><rect x="30" y="24" width="12" height="12"/><rect x="50" y="24" width="12" height="12"/><rect x="70" y="24" width="12" height="12"/></g>
  <text x="480" y="35" text-anchor="middle" font-size="11" fill="#788187">Leather Defect Detection — Live</text>

  <!-- ===== left: controls ===== -->
  <g fill="none" stroke="#b3bbc1" stroke-opacity=".22">
    <rect x="28" y="56" width="200" height="54"/>
    <rect x="28" y="118" width="200" height="112"/>
    <rect x="28" y="238" width="200" height="94"/>
    <rect x="28" y="340" width="200" height="92"/>
    <rect x="28" y="440" width="200" height="60"/>
  </g>
  <g font-size="9" fill="#788187" letter-spacing="1.5">
    <text x="38" y="70">MODEL</text>
    <text x="38" y="132">SOURCE</text>
    <text x="38" y="252">DISPLAY</text>
    <text x="38" y="354">DEFECT CLASSES</text>
    <text x="38" y="454">PASS / FAIL &amp; SCALE</text>
  </g>
  <g fill="#151a1c" stroke="#b3bbc1" stroke-opacity=".35">
    <rect x="38" y="76" width="180" height="18"/>
    <rect x="38" y="138" width="180" height="18"/>
    <rect x="38" y="184" width="86" height="18"/>
    <rect x="132" y="184" width="86" height="18"/>
    <rect x="38" y="206" width="180" height="18"/>
  </g>
  <g font-size="10" fill="#d5dadd">
    <text x="128" y="89" text-anchor="middle">load model (.keras)…</text>
    <text x="38" y="105" fill="#3d9f96">✓ v1.keras</text>
    <text x="46" y="151">webcam</text><text x="208" y="151" text-anchor="end" fill="#788187">▾</text>
    <text x="38" y="175" fill="#788187">camera index  0</text>
    <text x="81" y="197" text-anchor="middle">▶ start</text>
    <text x="175" y="197" text-anchor="middle">■ stop</text>
    <text x="128" y="219" text-anchor="middle">save snapshot</text>
    <text x="38" y="274">● overlay   ○ mask</text>
    <text x="38" y="292">○ side-by-side</text>
    <text x="38" y="310">○ original</text>
  </g>
  <line x1="38" y1="322" x2="218" y2="322" stroke="#b3bbc1" stroke-opacity=".35"/>
  <rect x="132" y="317" width="6" height="10" fill="#3d9f96"/>

  <!-- class toggles -->
  <g stroke="#888" stroke-width=".8">
    <rect x="38" y="364" width="10" height="10" fill="#ff0000"/>
    <rect x="38" y="384" width="10" height="10" fill="#00ff00"/>
    <rect x="38" y="404" width="10" height="10" fill="#0000ff"/>
    <rect x="132" y="364" width="10" height="10" fill="#ffff00"/>
    <rect x="132" y="384" width="10" height="10" fill="#ff00ff"/>
  </g>
  <g font-size="10" fill="#d5dadd">
    <text x="54" y="373">color</text><text x="54" y="393">cut</text><text x="54" y="413">fold</text>
    <text x="148" y="373">glue</text><text x="148" y="393">poke</text>
    <text x="38" y="474" fill="#788187">threshold</text><text x="218" y="474" text-anchor="end">1.0 %</text>
    <text x="38" y="492" fill="#788187">sample W × H</text><text x="218" y="492" text-anchor="end">— mm</text>
  </g>

  <!-- ===== centre: live view ===== -->
  <rect x="240" y="56" width="480" height="444" fill="#1c1a18" stroke="#444"/>
  <g stroke="#2b2825" stroke-width="1.2" fill="none">
    <path d="M250 120c40-20 70 10 110-8s60-30 100-6 70 14 110-4 60-10 140 6"/>
    <path d="M250 200c30 14 80-12 120 4s70 22 120 0 80-8 120 10 50 4 80-6"/>
    <path d="M250 290c50-16 90 18 140 0s60-26 110-4 70 18 120-2 40-6 70 4"/>
    <path d="M250 380c40 18 70-14 120 2s80 20 130-6 60-12 110 6 40 8 70-2"/>
    <path d="M250 450c60-10 90 14 150 0s70-18 120 2 60 10 140-4"/>
  </g>
  <path d="M366 196l64 52 6-4-62-54z" fill="#00ff00" fill-opacity=".55"/>
  <ellipse cx="580" cy="352" rx="62" ry="16" transform="rotate(-18 580 352)" fill="#0000ff" fill-opacity=".55"/>
  <circle cx="520" cy="150" r="6" fill="#ff00ff" fill-opacity=".6"/>
  <text x="252" y="492" font-size="10" fill="#788187">live view · overlay mode</text>

  <!-- ===== right: verdict + stats ===== -->
  <rect x="732" y="56" width="200" height="54" rx="6" fill="#b32424"/>
  <text x="832" y="90" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">FAIL</text>
  <g fill="none" stroke="#b3bbc1" stroke-opacity=".22">
    <rect x="732" y="118" width="200" height="40"/>
    <rect x="732" y="166" width="200" height="60"/>
    <rect x="732" y="234" width="200" height="266"/>
  </g>
  <g font-size="9" fill="#788187" letter-spacing="1.5">
    <text x="742" y="132">PERFORMANCE</text>
    <text x="742" y="180">DEFECT SUMMARY</text>
    <text x="742" y="248">PER-CLASS BREAKDOWN</text>
  </g>
  <g font-size="10" fill="#d5dadd">
    <text x="742" y="150">FPS  —</text>
    <text x="742" y="198" font-weight="600">total defect  — %</text>
    <text x="742" y="216" fill="#788187">area  — mm²</text>
  </g>
  <g stroke="#888" stroke-width=".8">
    <rect x="742" y="262" width="10" height="10" fill="#000000"/>
    <rect x="742" y="288" width="10" height="10" fill="#ff0000"/>
    <rect x="742" y="314" width="10" height="10" fill="#00ff00"/>
    <rect x="742" y="340" width="10" height="10" fill="#0000ff"/>
    <rect x="742" y="366" width="10" height="10" fill="#ffff00"/>
    <rect x="742" y="392" width="10" height="10" fill="#ff00ff"/>
  </g>
  <g font-size="10" fill="#d5dadd">
    <text x="758" y="271">background</text><text x="922" y="271" text-anchor="end" fill="#788187">— %</text>
    <text x="758" y="297">color</text><text x="922" y="297" text-anchor="end" fill="#788187">— %</text>
    <text x="758" y="323">cut</text><text x="922" y="323" text-anchor="end" fill="#788187">— %</text>
    <text x="758" y="349">fold</text><text x="922" y="349" text-anchor="end" fill="#788187">— %</text>
    <text x="758" y="375">glue</text><text x="922" y="375" text-anchor="end" fill="#788187">— %</text>
    <text x="758" y="401">poke</text><text x="922" y="401" text-anchor="end" fill="#788187">— %</text>
  </g>

  <!-- status bar -->
  <path d="M16 512.5H944" stroke="#b3bbc1" stroke-opacity=".2"/>
  <text x="28" y="532" font-size="10" fill="#788187">Running…</text>
</svg>
